name: Go verification
on:
  pull_request:
  push:
    branches:
      - main
      - 'test/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Unit and integration tests
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Compile lab
        run: go build -o /tmp/localreach-lab ./cmd/localreach-lab
      - name: Compile native diagnostic agent
        run: go build -o /tmp/localreach-agent ./cmd/localreach-agent
      - name: Compile loopback control plane
        run: go build -o /tmp/localreach-control ./cmd/localreach-control
      - name: Compile administrator CLI
        run: go build -o /tmp/localreach-admin ./cmd/localreach-admin
      - name: Verify separate processes over TLS
        run: bash scripts/verify-two-process.sh

  postgres-pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: localreach
          POSTGRES_PASSWORD: localreach-ci-only
          POSTGRES_DB: localreach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localreach -d localreach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOCALREACH_TEST_POSTGRES_DSN: postgres://localreach:localreach-ci-only@127.0.0.1:5432/localreach_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Transactional PostgreSQL pairing tests
        run: go test -race -p 1 -count=1 -v ./internal/pgpairing ./internal/pgauth ./internal/agentlifecycle ./internal/pairapi

  windows-agent-key-storage:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run Windows DPAPI identity tests
        run: go test -race -count=1 -v ./internal/agentkeys
      - name: Compile all Windows packages
        run: go test -count=1 ./...
      - name: Compile Windows diagnostic agent
        run: go build -o localreach-agent.exe ./cmd/localreach-agent
      - name: Compile Windows loopback control plane
        run: go build -o localreach-control.exe ./cmd/localreach-control
      - name: Compile Windows administrator CLI
        run: go build -o localreach-admin.exe ./cmd/localreach-admin

  macos-agent-key-storage:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Modern Apple dyld requires a toolchain with current Mach-O support.
          # The module's Go 1.22 source compatibility remains unchanged.
          go-version: '1.25.x'
          cache: false
      - name: macOS Security.framework and marker lifecycle tests
        run: go test -race -count=1 -v ./internal/agentkeys
      - name: Compile all macOS packages
        run: go test -count=1 ./...
      - name: Compile macOS diagnostic agent
        run: go build -o /tmp/localreach-agent ./cmd/localreach-agent
      - name: Compile macOS loopback control plane
        run: go build -o /tmp/localreach-control ./cmd/localreach-control
      - name: Compile macOS administrator CLI
        run: go build -o /tmp/localreach-admin ./cmd/localreach-admin
      - name: Verify CGo-disabled keychain path fails closed
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 ./internal/agentkeys
